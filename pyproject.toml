[project]
name = "sentinel-arena"
version = "0.1.0"
description = "A public challenge: submit a prompt-injection attack by pull request and see whether the guard stops it."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
arena = "arena.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
