name: weekly digest
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install .
          pip install "git+https://github.com/yurtseveronder-design/ai-sentinel.git" "git+https://github.com/yurtseveronder-design/sentinel-semantic.git"
      - name: Score
        run: arena run --guard sentinel-local --out site
      - name: Digest (read-only; changes no guard)
        run: arena digest --results site/results.json --history history --gaps known-gaps.jsonl | tee digest.md
      - name: Propose candidate block-phrases (dev gaps only; applied nowhere)
        run: |
          arena propose --gaps known-gaps.jsonl --out proposals/candidates.json | tee -a digest.md
          echo >> digest.md
          echo "Candidates are in proposals/candidates.json. Test with: arena run --guard overlay:proposals/candidates.json, then arena gate. Treat them as suggestions: they are mined from the project builder's own seed wording and can simply memorise it." >> digest.md
      - name: Commit snapshot if anything changed
        id: commit
        run: |
          git config user.name "arena-digest"
          git config user.email "arena-digest@users.noreply.github.com"
          git add history known-gaps.jsonl proposals
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; else
            git commit -m "Digest snapshot $(date -u +%F)" && git push && echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Open an issue for a human to review
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Arena digest $(date -u +%F)" --body-file digest.md
